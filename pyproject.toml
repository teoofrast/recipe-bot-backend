[project]
name = "receipt"
version = "0.1.0"
description = "Recipe chat-bot backend: parses recipes from videos and answers questions about them"
authors = [
    { name = "teoofrast", email = "teoofrast@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "chromadb-client==1.5.9",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "punq>=0.9.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[curl-cffi,default,deno]>=2026.8.19",
]

[project.scripts]
receipt = "receipt.bootstrap.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
# User-facing texts are in Russian: Cyrillic letters are intended, not look-alikes.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Blocking file and process calls are fine in tests: they do not serve concurrent requests.
"tests/**" = ["ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole run, like the app has: langchain-openai caches its HTTP client
# across calls, and a client bound to a closed loop fails with "Event loop is closed".
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
# Integration tests hit real platforms: run them explicitly with `pytest -m integration`.
addopts = ["-m", "not integration"]
markers = ["integration: talks to real external services (network)"]

[tool.importlinter]
root_package = "receipt"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean architecture layers"
type = "layers"
# Higher layers may import lower ones, never the other way round.
# presentation and infrastructure are independent: they meet only in bootstrap.
layers = [
    "receipt.bootstrap",
    "receipt.presentation | receipt.infrastructure",
    "receipt.application",
    "receipt.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application stay framework-free"
type = "forbidden"
source_modules = ["receipt.domain", "receipt.application"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sse_starlette",
    "pydantic",
    "pydantic_settings",
    "punq",
    "langchain",
    "langchain_core",
    "langchain_openai",
    "langgraph",
    "yt_dlp",
    "aiogram",
    "httpx",
    "chromadb",
    "openai",
]
