[project]
name = "receipt"
version = "0.1.0"
description = "Recipe chat-bot backend: parses recipes from videos and answers questions about them"
authors = [
    { name = "teoofrast", email = "teoofrast@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "punq>=0.9.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
receipt = "receipt.bootstrap.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.importlinter]
root_package = "receipt"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean architecture layers"
type = "layers"
# Higher layers may import lower ones, never the other way round.
# presentation and infrastructure are independent: they meet only in bootstrap.
layers = [
    "receipt.bootstrap",
    "receipt.presentation | receipt.infrastructure",
    "receipt.application",
    "receipt.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application stay framework-free"
type = "forbidden"
source_modules = ["receipt.domain", "receipt.application"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sse_starlette",
    "pydantic",
    "pydantic_settings",
    "punq",
    "langchain",
    "langchain_core",
    "langchain_openai",
    "langgraph",
    "yt_dlp",
    "aiogram",
    "httpx",
]
