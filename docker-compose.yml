services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ${FRONTEND_PATH:-../recipe-bot-frontend}
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  # Telegram bot appears in card 10; until then start it explicitly: docker compose --profile bot up
  bot:
    build: .
    command: ["python", "-m", "receipt.presentation.bot"]
    env_file: .env
    profiles: ["bot"]
    depends_on:
      api:
        condition: service_healthy

  chroma:
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma-data:/data

volumes:
  chroma-data:
